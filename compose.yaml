services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./postgres:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5433:5432"
    mem_limit: 512m
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - ./models:/root/.cache/huggingface
    ports:
      - "127.0.0.1:8100:8000"
    depends_on:
      - db
      - pot
    mem_limit: 2g
  frontend:
    image: node:22-alpine
    user: "1000:1000"
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./frontend:/app
    ports:
      - "8101:5173"
    depends_on:
      - backend
    mem_limit: 512m
  frontend-dev:
    image: node:22-alpine
    profiles: ["dev"]
    user: "1000:1000"
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./frontend:/app
    ports:
      - "8102:5173"
    depends_on:
      - backend
    mem_limit: 512m
  pot:
    image: brainicism/bgutil-ytdlp-pot-provider
    restart: unless-stopped
    mem_limit: 256m